<text class="t devs" x="1071" y="646">RDS3115 双轴</text>
<text class="t devs" x="1071" y="668">TIM2_CH3 · PWM</text>
<text class="t devs" x="1071" y="690">E 键切换：低头 / 前视</text>
<line class="wire" x1="1040" y1="645" x2="1055" y2="645" marker-end="url(#ab)"/>

<!-- ===== 左侧：遥控 / IMU / 调试 ===== -->
<rect class="box" x="60" y="110" width="200" height="70" rx="10"/>
<text class="t devt" x="78" y="138">DR16 遥控器</text>
<text class="t devs" x="78" y="162">2.4 GHz</text>
<line class="air" x1="160" y1="180" x2="160" y2="220" marker-end="url(#aa)"/>
<text class="t albl" x="175" y="207">2.4 GHz</text>

